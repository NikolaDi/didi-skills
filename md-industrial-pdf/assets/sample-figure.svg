<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="640" height="230" fill="#F4F6F8"/>
  <text x="20" y="30" fill="#2C3440" font-size="15" font-weight="bold">图 1  系统连接示意 / System Wiring</text>

  <!-- 主机 -->
  <rect x="24" y="70" width="150" height="64" fill="#2C3440"/>
  <text x="99" y="98" fill="#FFFFFF" font-size="13" text-anchor="middle">主机 HMI</text>
  <text x="99" y="118" fill="#C9D2DC" font-size="11" text-anchor="middle">MASTER</text>

  <!-- 总线 -->
  <line x1="174" y1="102" x2="560" y2="102" stroke="#2C3440" stroke-width="2"/>
  <line x1="174" y1="112" x2="560" y2="112" stroke="#8A95A5" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="360" y="94" fill="#8A95A5" font-size="11" text-anchor="middle">RS-485  ·  9600 8N1  ·  ≤1200 m</text>

  <!-- 从站 -->
  <rect x="230" y="140" width="110" height="56" fill="#FFFFFF" stroke="#2C3440" stroke-width="1.2"/>
  <text x="285" y="164" fill="#2C3440" font-size="12" text-anchor="middle">从站 #1</text>
  <text x="285" y="182" fill="#8A95A5" font-size="10" text-anchor="middle">0x01</text>
  <line x1="285" y1="120" x2="285" y2="140" stroke="#2C3440" stroke-width="1.2"/>

  <rect x="360" y="140" width="110" height="56" fill="#FFFFFF" stroke="#2C3440" stroke-width="1.2"/>
  <text x="415" y="164" fill="#2C3440" font-size="12" text-anchor="middle">从站 #2</text>
  <text x="415" y="182" fill="#8A95A5" font-size="10" text-anchor="middle">0x02</text>
  <line x1="415" y1="120" x2="415" y2="140" stroke="#2C3440" stroke-width="1.2"/>

  <rect x="490" y="140" width="110" height="56" fill="#FFFFFF" stroke="#2C3440" stroke-width="1.2"/>
  <text x="545" y="164" fill="#2C3440" font-size="12" text-anchor="middle">从站 #3</text>
  <text x="545" y="182" fill="#8A95A5" font-size="10" text-anchor="middle">0x03</text>
  <line x1="545" y1="120" x2="545" y2="140" stroke="#2C3440" stroke-width="1.2"/>

  <text x="20" y="216" fill="#8A95A5" font-size="10">总线两端各加 120 Ω 终端电阻，屏蔽层单点接地。</text>
</svg>
